apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portfoli
  namespace: default
  annotations:
    traefik.terraform.tf/v1: "internal-only"
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`santi.ramisclar.cat`)
      kind: Rule
      services:
        - name: portfoli
          port: 80
      middlewares:
        - name: security-headers
          namespace: default
# TLS disabled — internal only. Enable when going public:
#  tls:
#    certResolver: letsencrypt-prod
#    domains:
#      - main: santi.ramisclar.cat