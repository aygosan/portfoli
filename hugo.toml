baseURL = "https://santi.ramisclar.cat/"
title = "Santiago Ramis: Platform Engineer"
theme = "PaperMod"
enableRobotsTXT = true
enableGitInfo = false

# Multi-language
# contentDir per language so the default (ca) is served at site root (/about/)
# instead of /ca/about/. Without this, Hugo treats content/ca as a section.
defaultContentLanguage = "ca"
defaultContentLanguageInSubdir = false

[languages.ca]
  label = "Català"
  weight = 1
  title = "Santiago Ramis: Platform Engineer"
  contentDir = "content/ca"

[languages.en]
  label = "English"
  weight = 2
  title = "Santiago Ramis: Platform Engineer"
  contentDir = "content/en"

[languages.es]
  label = "Español"
  weight = 3
  title = "Santiago Ramis: Platform Engineer"
  contentDir = "content/es"

# PaperMod params
[params]
  defaultTheme = "dark"
  showReadingTime = false
  showShareButtons = false
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  author = "Santiago Ramis"
  description = "Platform Engineer: Kubernetes, GitOps, automatització d'infraestructura"
  DateFormat = "2006-01-02"
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  disableHLJS = false
  disableThemeToggle = true

# Social
[[params.socialIcons]]
  name = "linkedin"
  url = "https://linkedin.com/in/ramissan"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/aygosan"

[[params.socialIcons]]
  name = "email"
  url = "mailto:santi@ramisclar.cat"

# Home page profile
[params.homeInfoParams]
  Title = "Santiago Ramis"
  Content = "Platform Engineer amb més de 20 anys d'experiència en IT. Actualment enfocat en Kubernetes, GitOps i automatització d'infraestructura. Construeixo i opero TekGarden, un homelab convertit en plataforma de producció."

# Editable links
[params.editPost]
  URL = "https://github.com/aygosan/portfoli/tree/main/content"
  Text = "Edit this page"
  appendFilePath = true

# Menu — use language-relative URLs
# identifier must be an absolute path (e.g. "/about") because PaperMod calls
# site.GetPage .KeyName; a bare name like "about" is ambiguous across the
# multilingual content tree, while "/about" resolves within the current language.
[[languages.ca.menu.main]]
  identifier = "/about"
  name = "Sobre mi"
  url = "/about/"
  weight = 1

