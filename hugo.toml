baseURL = "https://aygosan.github.io/portfoli/"
title = "Santiago Ramis — Platform Engineer"
theme = "PaperMod"
enableRobotsTXT = true
enableGitInfo = true

# Multi-language
defaultContentLanguage = "ca"

[languages.ca]
  label = "Català"
  weight = 1
  title = "Santiago Ramis — Platform Engineer"

[languages.en]
  label = "English"
  weight = 2
  title = "Santiago Ramis — Platform Engineer"

[languages.es]
  label = "Español"
  weight = 3
  title = "Santiago Ramis — Platform Engineer"

# PaperMod params
[params]
  defaultTheme = "dark"
  showReadingTime = false
  showShareButtons = false
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  author = "Santiago Ramis"
  description = "Platform Engineer / DevOps & SRE"
  DateFormat = "2006-01-02"
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  disableHLJS = false
  disableThemeToggle = true

# Social
[[params.socialIcons]]
  name = "linkedin"
  url = "https://linkedin.com/in/ramissan"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/aygosan"

[[params.socialIcons]]
  name = "email"
  url = "mailto:santi@ramisclar.cat"

# Home page profile
[params.homeInfoParams]
  Title = "Santiago Ramis"
  Content = "Platform Engineer building self-managed Kubernetes infrastructure, GitOps pipelines, and observability stacks. Currently running TekGarden — a homelab-turned-platform."

# Editable links
[params.editPost]
  URL = "https://github.com/aygosan/portfoli/tree/main/content"
  Text = "Edit this page"
  appendFilePath = true

