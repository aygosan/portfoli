{{/* Mermaid.js for diagram support — loaded only on pages that use the mermaid shortcode */}}
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    if (typeof mermaid !== "undefined") {
      mermaid.initialize({
        startOnLoad: true,
        theme: "base",
        themeVariables: {
          darkMode: true,
          background: "#0b0f0c",
          fontFamily: "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
          fontSize: "15px",
          primaryColor: "#131a15",
          primaryTextColor: "#e2e8f0",
          primaryBorderColor: "#4ade80",
          secondaryColor: "#131a15",
          secondaryTextColor: "#e2e8f0",
          secondaryBorderColor: "#4ade80",
          tertiaryColor: "#131a15",
          tertiaryTextColor: "#e2e8f0",
          tertiaryBorderColor: "#4ade80",
          lineColor: "#4ade80",
          textColor: "#e2e8f0",
          mainBkg: "#131a15",
          nodeBorder: "#4ade80",
          clusterBkg: "#12181a",
          clusterBorder: "#4ade80",
          titleColor: "#e2e8f0",
          edgeLabelBackground: "#0b0f0c",
          defaultLinkColor: "#4ade80"
        }
      });
    }
  });
</script><script>
  (function () {
    function initZoom() {
      var lb = document.createElement('div');
      lb.className = 'mermaid-lightbox';
      document.body.appendChild(lb);
      function close() { lb.classList.remove('open'); lb.innerHTML = ''; }
      lb.addEventListener('click', close);
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
      document.addEventListener('click', function (e) {
        var m = e.target.closest('.mermaid');
        if (!m) return;
        var svg = m.querySelector('svg');
        if (!svg) return;
        lb.innerHTML = '';
        lb.appendChild(svg.cloneNode(true));
        lb.classList.add('open');
      });
      var lang = document.documentElement.lang || 'ca';
      var hints = { ca: 'clica per ampliar', en: 'click to expand', es: 'haz clic para ampliar' };
      var text = hints[lang] || hints.ca;
      document.querySelectorAll('.mermaid').forEach(function (m) {
        var h = document.createElement('span');
        h.className = 'mermaid-hint';
        h.textContent = text;
        m.after(h);
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initZoom);
    } else {
      initZoom();
    }
  })();

    function init() {
      var nav = document.querySelector('.header-nav');
      var btn = document.querySelector('.nav-toggle');
      if (!nav || !btn) return;
      btn.addEventListener('click', function () {
        var open = nav.classList.toggle('nav-open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
</script>
