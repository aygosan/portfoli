  <text x="40" y="60" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" fill="#64748b">TekGarden: accés públic zero-trust i serveis interns</text>
  <text x="40" y="112" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" fill="#64748b">EDGE · VPS HETZNER</text>
  <text x="40" y="300" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" fill="#64748b">PROXMOX / ON-PREM</text>
