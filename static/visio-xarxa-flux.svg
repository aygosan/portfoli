<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="tit desc">
<title id="tit">Visió de xarxa · flux d'accés</title>
<desc id="desc">Flux d'accés: els usuaris entren per Cloudflare; Pangolin (gateway zero-trust al VPS Hetzner) estableix el túnel fins al router pfSense, que només permet DNS intern i els ingressos Traefik de QNAP i k3s, protegits amb CrowdSec. Sobre Proxmox hi corren k3s i els hosts Docker; Forgejo fa el GitOps i els backups van a Backblaze B2, amb secrets a 1Password i alertes per Telegram.</desc>
