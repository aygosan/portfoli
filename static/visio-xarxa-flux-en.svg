<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="tit desc">
<title id="tit">Network overview · access flow</title>
<desc id="desc">Access flow: users come in through Cloudflare; Pangolin (zero-trust gateway on the Hetzner VPS) tunnels to the pfSense router, which only allows internal DNS and the Traefik ingresses of QNAP and k3s, protected by CrowdSec. k3s and the Docker hosts run on Proxmox; Forgejo drives GitOps and backups go to Backblaze B2, with secrets in 1Password and alerts via Telegram.</desc>
